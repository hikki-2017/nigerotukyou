<body>
  <div id="game-container">
    <div id="vignette"></div>
    <div id="hud">
      <div class="hud-stats">
        <div class="stat-box">
          <span class="label">DISTANCE</span>
          <span id="distance-val" class="value">00000</span>
        </div>
        <div class="stat-box">
          <span class="label">ALERT LEVEL</span>
          <span id="speed-val" class="value">LOW</span>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="content">
        <h1 class="logo">TOKYO<span>ESCAPE</span></h1>
        <p class="subtitle">THE GREAT ESCAPE FROM TOKYO</p>
        <button id="start-button">ENGINE ON / START ESCAPE</button>
        <div class="controls-hint">
          <span>A / D or ← / → : STEER THROUGH TOKYO</span>
          <span>SPACE : BOOST JUMP</span>
          <span>SHIFT / W : FULL EFFORT DASH</span>
        </div>
      </div>
    </div>

    <div id="game-over-screen" class="overlay hidden">
      <div class="content">
        <h2 class="title">CAPTURED</h2>
        <p class="summary">ESCAPE ATTEMPT TERMINATED</p>
        <div class="final-score">
          <span>DISTANCE COVERED</span>
          <span id="final-distance">0</span>
        </div>
        <button id="restart-button">RETRY ESCAPE</button>
      </div>
    </div>
  </div>
</body>
